<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Boom Daddy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    .btn {
      padding: 20px 50px;
      font-size: 2rem;
      font-weight: bold;
      background: #ff4500;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      z-index: 10;
      transition: transform 0.1s;
    }

    .btn:active { transform: scale(0.95); }

    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: explode 0.8s ease-out forwards;
    }

    @keyframes explode {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    .boom-text {
      position: fixed;
      font-size: 5rem;
      font-weight: 900;
      color: #ff4500;
      pointer-events: none;
      animation: boomPop 0.6s ease-out forwards;
      z-index: 20;
      text-shadow: 0 0 20px #ff4500, 0 0 40px #ff8c00;
    }

    @keyframes boomPop {
      0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50%  { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [particles, setParticles] = useState([]);
      const [booms, setBooms] = useState([]);

      function handleClick(e) {
        const x = e.clientX;
        const y = e.clientY;

        const colors = ['#ff4500', '#ff8c00', '#ffd700', '#ff6347', '#fff'];
        const newParticles = Array.from({ length: 40 }, (_, i) => ({
          id: Date.now() + i,
          x,
          y,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 20 + 8,
          dx: (Math.random() - 0.5) * 400 + 'px',
          dy: (Math.random() - 0.5) * 400 + 'px',
        }));

        const boom = { id: Date.now(), x, y };

        setParticles(p => [...p, ...newParticles]);
        setBooms(b => [...b, boom]);

        setTimeout(() => {
          setParticles(p => p.filter(p => !newParticles.find(n => n.id === p.id)));
          setBooms(b => b.filter(b => b.id !== boom.id));
        }, 900);
      }

      return (
        <>
          <button className="btn" onClick={handleClick}>
            BOOM DADDY
          </button>

          {particles.map(p => (
            <div
              key={p.id}
              className="particle"
              style={{
                left: p.x,
                top: p.y,
                width: p.size,
                height: p.size,
                background: p.color,
                '--dx': p.dx,
                '--dy': p.dy,
              }}
            />
          ))}

          {booms.map(b => (
            <div
              key={b.id}
              className="boom-text"
              style={{ left: b.x, top: b.y }}
            >
              BOOM!
            </div>
          ))}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
